<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c061a">
  <title>Columbus — Live Viewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="viewer-page">

  <main id="app" class="app">
    <div id="map" class="map" role="region" aria-label="Columbus live shared map"></div>

    <header class="topbar">
      <div class="brand-badge">
        <span class="brand-compass" aria-hidden="true">🧭</span>
        <span class="brand-title">Columbus</span>
        <span class="live-status-pill">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="link-status">Connecting</span>
        </span>
      </div>
    </header>

    <p id="banner" class="banner" role="status" aria-live="polite" hidden></p>

    <!-- Floating Speed HUD on viewer -->
    <div class="hud-cockpit hud-cockpit-speed" id="hud-speedometer">
      <span class="speed-value numeral" id="hud-speed-num">0</span>
      <span class="speed-unit-btn">KM/H</span>
    </div>

    <!-- Viewer Bottom Sheet -->
    <section class="sheet" aria-label="Current position">
      <div class="sheet-top">
        <p id="status" class="status" data-tone="idle">
          <span class="led" aria-hidden="true"></span>
          <span id="status-text">Waiting for live location…</span>
        </p>
        <div class="seg" role="group" aria-label="Map view mode">
          <button id="mode-follow" type="button" aria-pressed="true">Follow</button>
          <button id="mode-free" type="button" aria-pressed="false">Free</button>
        </div>
      </div>

      <div class="sheet-body">
        <div class="trip-card">
          <div class="figure">
            <p class="numeral" id="updated-clock">-</p>
            <p class="figure-label">Last Position Ping</p>
          </div>
          <div class="figure">
            <p class="numeral" id="speed">-</p>
            <p class="figure-label">Speed</p>
          </div>
          <p class="trip-note">Live stream enabled. New positions stream automatically as the vehicle moves.</p>
        </div>

        <div class="readings-grid">
          <div class="reading-tile"><dt>Latitude</dt><dd id="lat">-</dd></div>
          <div class="reading-tile"><dt>Longitude</dt><dd id="lng">-</dd></div>
          <div class="reading-tile"><dt>Accuracy</dt><dd id="acc">-</dd></div>
        </div>
      </div>
    </section>

    <div id="message" class="message" hidden>
      <div class="section" style="max-width: 400px; margin: 100px auto; text-align: center;">
        <h1 id="message-title" style="font-size: 20px; color: var(--purple-200);">Share Link Inactive</h1>
        <p id="message-text" style="color: var(--steel); font-size: 14px;">This live tracking session has ended or been reset by the owner.</p>
      </div>
    </div>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/live.js"></script>
</body>
</html>
